<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCADE SNAKE 20x20</title>
    <style>
        /* 기본 리셋 및 다크 아케이드 테마 변수 */
        :root {
            --bg-main: #0f0a14;
            --bg-panel: #1b1224;
            --bg-board: #140d1c;
            --grid-line: #291b38;
            --snake-head: #f472b6;
            --snake-body: #ec4899;
            --snake-border: #be185d;
            --star-color: #fbbf24;
            --star-glow: rgba(251, 191, 36, 0.75);
            --obstacle-bg: #2a1822;
            --obstacle-border: #f43f5e;
            --text-primary: #fdf2f8;
            --text-secondary: #cbd5e1;
            --accent-neon: #f9a8d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; /* 모바일 스크롤 및 바운스 방지 */
            touch-action: manipulation;
        }

        /* 전체 앱 컨테이너: 한 화면에 모든 요소가 들어오도록 Flex 배치 */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100dvh; /* 모바일 동적 뷰포트 대응 */
            max-width: 540px;
            margin: 0 auto;
            padding: 12px 16px;
            gap: 10px;
        }

        /* 상단 헤더 및 스코어보드 */
        .header-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: var(--snake-head);
            text-shadow: 0 0 12px rgba(244, 114, 182, 0.55);
            white-space: nowrap;
        }

        /* 상단 HUD 그리드 (STAGE, STARS, SCORE, BEST) */
        .hud-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
        }

        .score-box {
            background-color: var(--bg-panel);
            border: 1px solid var(--grid-line);
            border-radius: 10px;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .score-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 1.05rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            line-height: 1.2;
        }

        #stageVal {
            color: var(--accent-neon);
        }

        #starVal {
            color: var(--star-color);
        }

        #highScoreVal {
            color: #fbbf24;
        }

        /* 별 수집 진행도 미니 게이지 바 */
        .star-progress-track {
            width: 100%;
            height: 3px;
            background-color: #1e293b;
            border-radius: 999px;
            margin-top: 3px;
            overflow: hidden;
        }

        .star-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #fde047);
            transition: width 0.2s ease-out;
        }

        /* 상단 게임 상태 컨트롤 버튼 (시작, 일시정지, 다시 시작) */
        .control-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
        }

        .ctrl-btn {
            background: linear-gradient(180deg, #263349 0%, #182234 100%);
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 9px 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.12s ease;
            box-shadow: 0 3px 0 #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .ctrl-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border-color: var(--accent-neon);
        }

        .ctrl-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f172a;
        }

        .ctrl-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .ctrl-btn.primary {
            background: linear-gradient(180deg, #ec4899 0%, #db2777 100%);
            border-color: #f9a8d4;
            color: #fff1f2;
            box-shadow: 0 3px 0 #831843;
        }

        .ctrl-btn.primary:hover:not(:disabled) {
            background: linear-gradient(180deg, #f472b6 0%, #ec4899 100%);
        }

        .ctrl-btn.warning {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            border-color: #fde047;
            color: #422006;
            box-shadow: 0 3px 0 #713f12;
        }

        /* 중앙 게임 보드 래퍼 (남은 공간을 최대 활용하여 정사각형 유지) */
        .board-wrapper {
            flex: 1;
            width: 100%;
            min-height: 0; /* Flex 자식 축소 허용 */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-container {
            position: relative;
            border-radius: 12px;
            padding: 4px;
            background: linear-gradient(135deg, #2d1b3d, #140d1c);
            border: 2px solid #4c285e;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 18px rgba(236, 72, 153, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background-color: var(--bg-board);
            border-radius: 8px;
        }

        /* 캔버스 위 오버레이 (시작 안내, 일시정지, 게임 오버) */
        .board-overlay {
            position: absolute;
            inset: 4px;
            background-color: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(3px);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            z-index: 10;
            transition: opacity 0.2s ease;
        }

        .board-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--snake-head);
            text-shadow: 0 0 14px rgba(244, 114, 182, 0.6);
        }

        .overlay-title.gameover {
            color: #f43f5e;
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
        }

        .overlay-title.stageclear {
            color: #fbbf24;
            text-shadow: 0 0 14px rgba(251, 191, 36, 0.6);
        }

        .overlay-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .overlay-desc strong {
            color: var(--text-primary);
        }

        .overlay-btn {
            background: linear-gradient(180deg, #ec4899 0%, #db2777 100%);
            color: #fff1f2;
            border: 1px solid #f9a8d4;
            border-radius: 999px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.45);
            transition: transform 0.1s;
        }

        .overlay-btn:active {
            transform: scale(0.95);
        }

        .overlay-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .overlay-btn.secondary {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            color: var(--text-primary);
            border: 1px solid #475569;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .overlay-btn.secondary.hidden {
            display: none;
        }

        /* 하단 터치 방향 패드 (D-Pad) */
        .dpad-section {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 4px;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 62px);
            grid-template-rows: repeat(3, 54px);
            gap: 6px;
        }

        .dpad-btn {
            background: linear-gradient(180deg, #1e293b 0%, #111827 100%);
            border: 1.5px solid #334155;
            border-radius: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #090d16;
            transition: background 0.08s, transform 0.08s;
            touch-action: manipulation;
        }

        .dpad-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            pointer-events: none;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
            border-color: #fbcfe8;
            color: #fff1f2;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #090d16;
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-center {
            grid-column: 2;
            grid-row: 2;
            background: #0f1522;
            border: 1px solid #1e293b;
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        .hint-text {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: center;
        }

        /* 화면 높이가 매우 낮은 가로모드/소형 모바일 대응 */
        @media (max-height: 640px) {
            .app-container {
                padding: 8px 12px;
                gap: 6px;
            }
            .game-title { font-size: 1.05rem; }
            .score-box { padding: 4px 6px; }
            .score-value { font-size: 0.95rem; }
            .ctrl-btn { padding: 6px 4px; font-size: 0.78rem; }
            .dpad-grid {
                grid-template-columns: repeat(3, 54px);
                grid-template-rows: repeat(3, 44px);
                gap: 4px;
            }
            .hint-text { display: none; }
        }

        /* 데스크톱 대화면에서는 D-Pad 크기를 적당히 조절 */
        @media (min-width: 768px) {
            .dpad-grid {
                grid-template-columns: repeat(3, 56px);
                grid-template-rows: repeat(3, 48px);
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 타이틀 및 점수 영역 -->
    <header class="header-section">
        <div class="title-row">
            <h1 class="game-title">SNAKE 20×20</h1>
            <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">★ 10개 수집 시 다음 단계</span>
        </div>

        <!-- 4칸 아케이드 상태판 (STAGE / STARS / SCORE / BEST) -->
        <div class="hud-grid">
            <div class="score-box">
                <span class="score-label">STAGE</span>
                <span class="score-value" id="stageVal">1 / 10</span>
            </div>
            <div class="score-box">
                <span class="score-label">STARS</span>
                <span class="score-value" id="starVal">★ 0 / 10</span>
                <div class="star-progress-track">
                    <div class="star-progress-fill" id="starProgressFill"></div>
                </div>
            </div>
            <div class="score-box">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="currentScoreVal">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">BEST</span>
                <span class="score-value" id="highScoreVal">0</span>
            </div>
        </div>

        <!-- 게임 제어 버튼 -->
        <div class="control-bar">
            <button type="button" class="ctrl-btn primary" id="btnStart">▶ 게임 시작</button>
            <button type="button" class="ctrl-btn" id="btnPause" disabled>⏸ 일시정지</button>
            <button type="button" class="ctrl-btn" id="btnRestart">↻ 처음부터</button>
        </div>
    </header>

    <!-- 중앙 20x20 캔버스 보드 영역 -->
    <main class="board-wrapper" id="boardWrapper">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas"></canvas>

            <!-- 상태 알림 오버레이 -->
            <div class="board-overlay" id="boardOverlay">
                <div class="overlay-title" id="overlayTitle">STAGE 1</div>
                <div class="overlay-desc" id="overlayDesc">
                    별(★) 10개를 모으면 다음 단계로 이동합니다!<br>
                    장애물과 벽을 피해 모든 단계를 정복하세요.
                </div>
                <div class="overlay-btn-group">
                    <button type="button" class="overlay-btn" id="overlayActionBtn">게임 시작</button>
                    <button type="button" class="overlay-btn secondary hidden" id="overlayResetBtn">1단계부터 시작</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 모바일/태블릿 터치 D-Pad -->
    <footer class="dpad-section">
        <div class="dpad-grid">
            <button type="button" class="dpad-btn dpad-up" data-dir="UP" aria-label="위로 이동">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
            </button>
            <button type="button" class="dpad-btn dpad-left" data-dir="LEFT" aria-label="왼쪽으로 이동">
                <svg viewBox="0 0 24 24"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
            </button>
            <div class="dpad-center"></div>
            <button type="button" class="dpad-btn dpad-right" data-dir="RIGHT" aria-label="오른쪽으로 이동">
                <svg viewBox="0 0 24 24"><path d="M20 12l-8 8v-5H4v-6h8V4z"/></svg>
            </button>
            <button type="button" class="dpad-btn dpad-down" data-dir="DOWN" aria-label="아래로 이동">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>
            </button>
        </div>
        <div class="hint-text">PC: 방향키 / WASD / Space(일시정지) · 모바일: 터치 패드</div>
    </footer>
</div>

<script>
/**
 * 20x20 10단계 아케이드 스네이크 게임
 * - 총 10단계 구성, 스테이지당 별(★) 10개 획득 시 클리어
 * - 단계가 오를수록 장애물 증가 및 이동 속도 점진적 상승
 * - 탈락 시 현재 단계 유지 및 해당 단계 시작 점수로 즉시 재도전 가능
 */
(function () {
    'use strict';

    // === 게임 상수 설정 ===
    const GRID_SIZE = 20;               // 20x20 격자
    const MAX_STAGE = 10;               // 총 10단계
    const STARS_PER_STAGE = 10;         // 스테이지당 목표 별 개수
    const POINTS_PER_STAR = 10;         // 별 1개당 점수
    const STAGE_CLEAR_BONUS = 50;       // 스테이지 클리어 보너스 점수
    const STORAGE_KEY = 'arcade_snake_10stages_best_v1';

    // 방향 벡터 정의
    const DIRECTIONS = {
        UP:    { x: 0,  y: -1, opposite: 'DOWN' },
        DOWN:  { x: 0,  y: 1,  opposite: 'UP' },
        LEFT:  { x: -1, y: 0,  opposite: 'RIGHT' },
        RIGHT: { x: 1,  y: 0,  opposite: 'LEFT' }
    };

    // === 10단계 스테이지별 설정 (속도 ms, 이름, 장애물 좌표 생성기) ===
    // 뱀 초기 위치: [{x:6, y:10}, {x:5, y:10}, {x:4, y:10}] -> 오른쪽(x: 7~13, y: 10) 경로는 항상 비워둠
    const STAGE_CONFIGS = [
        {
            stage: 1,
            name: 'STAGE 1 : WARM UP',
            tickMs: 155,
            desc: '장애물이 없는 기본 스테이지입니다.<br>별 10개를 모아 몸을 풀고 다음 단계로 가세요!',
            getObstacles: () => []
        },
        {
            stage: 2,
            name: 'STAGE 2 : FOUR PILLARS',
            tickMs: 148,
            desc: '네 모서리에 4개의 기둥 장애물이 등장합니다.<br>기둥을 피해 별 10개를 수집하세요!',
            getObstacles: () => [
                { x: 4, y: 4 }, { x: 15, y: 4 },
                { x: 4, y: 15 }, { x: 15, y: 15 }
            ]
        },
        {
            stage: 3,
            name: 'STAGE 3 : TWIN BARS',
            tickMs: 142,
            desc: '위아래에 가로 장벽(8개)이 설치되었습니다.<br>회전 반경을 잘 계산해 움직이세요!',
            getObstacles: () => [
                { x: 8, y: 4 }, { x: 9, y: 4 }, { x: 10, y: 4 }, { x: 11, y: 4 },
                { x: 8, y: 15 }, { x: 9, y: 15 }, { x: 10, y: 15 }, { x: 11, y: 15 }
            ]
        },
        {
            stage: 4,
            name: 'STAGE 4 : CORNER BRACKETS',
            tickMs: 136,
            desc: '네 구석에 ㄱ자형 벙커(12개)가 배치됩니다.<br>구석에 갇히지 않도록 주의하세요!',
            getObstacles: () => [
                { x: 3, y: 3 }, { x: 4, y: 3 }, { x: 3, y: 4 },
                { x: 16, y: 3 }, { x: 15, y: 3 }, { x: 16, y: 4 },
                { x: 3, y: 16 }, { x: 4, y: 16 }, { x: 3, y: 15 },
                { x: 16, y: 16 }, { x: 15, y: 16 }, { x: 16, y: 15 }
            ]
        },
        {
            stage: 5,
            name: 'STAGE 5 : CROSS GATES',
            tickMs: 130,
            desc: '중앙을 둘러싼 십자 게이트(16개)가 나타납니다.<br>넓은 통로를 통해 안전하게 통과하세요!',
            getObstacles: () => [
                { x: 9, y: 2 }, { x: 10, y: 2 }, { x: 9, y: 3 }, { x: 10, y: 3 },
                { x: 9, y: 16 }, { x: 10, y: 16 }, { x: 9, y: 17 }, { x: 10, y: 17 },
                { x: 2, y: 7 }, { x: 3, y: 7 }, { x: 2, y: 13 }, { x: 3, y: 13 },
                { x: 16, y: 7 }, { x: 17, y: 7 }, { x: 16, y: 13 }, { x: 17, y: 13 }
            ]
        },
        {
            stage: 6,
            name: 'STAGE 6 : SLALOM COURSE',
            tickMs: 124,
            desc: '지그재그로 배치된 기둥(20개) 코스입니다.<br>리듬감 있는 방향 전환이 필요합니다!',
            getObstacles: () => [
                { x: 4, y: 3 }, { x: 4, y: 4 }, { x: 4, y: 5 }, { x: 4, y: 6 },
                { x: 15, y: 3 }, { x: 15, y: 4 }, { x: 15, y: 5 }, { x: 15, y: 6 },
                { x: 9, y: 6 }, { x: 10, y: 6 }, { x: 9, y: 14 }, { x: 10, y: 14 },
                { x: 4, y: 13 }, { x: 4, y: 14 }, { x: 4, y: 15 }, { x: 4, y: 16 },
                { x: 15, y: 13 }, { x: 15, y: 14 }, { x: 15, y: 15 }, { x: 15, y: 16 }
            ]
        },
        {
            stage: 7,
            name: 'STAGE 7 : BROKEN FORTRESS',
            tickMs: 118,
            desc: '4개의 출입구가 열린 내부 요새(24개)입니다.<br>안팎을 오가며 별을 획득하세요!',
            getObstacles: () => [
                { x: 5, y: 5 }, { x: 6, y: 5 }, { x: 7, y: 5 },
                { x: 5, y: 6 }, { x: 5, y: 7 }, { x: 5, y: 8 },
                { x: 14, y: 5 }, { x: 13, y: 5 }, { x: 12, y: 5 },

    // === DOM 요소 참조 ===
    const boardWrapper = document.getElementById('boardWrapper');
    const canvas = document.getElementById('gameCanvas');

    const dpadButtons = document.querySelectorAll('.dpad-btn[data-dir]');

    // === 게임 상태 변수 ===
    let currentStage = 1;           // 현재 단계 (1 ~ 10)
    let stageStartScore = 0;        // 현재 단계 시작 시점의 누적 점수 (단계 재도전 시 복원용)
    let starsCollected = 0;         // 현재 단계에서 먹은 별 개수 (0 ~ 10)
    let currentTickInterval = 155;  // 현재 단계의 이동 간격(ms)

    let snake = [];                 // 뱀의 몸통 좌표 배열
    let obstacles = [];             // 현재 단계의 장애물 좌표 배열
    let starItem = { x: 14, y: 10 };// 현재 별 먹이 좌표
    let currentDir = 'RIGHT';       // 현재 이동 중인 방향
    let inputQueue = [];            // 빠른 연타 및 역방향 방지용 입력 큐
    let score = 0;                  // 총 누적 점수
    let highScore = 0;              // 최고 점수
    let gameState = 'READY';        // 'READY' | 'PLAYING' | 'PAUSED' | 'STAGE_CLEAR' | 'GAMEOVER' | 'ALL_CLEAR'

    let lastTickTime = 0;           // 마지막 그리드 이동 시각
    let animationFrameId = null;    // requestAnimationFrame ID
    let cellSize = 20;              // 1칸의 픽셀 크기 (반응형 계산)
    let particles = [];             // 별 획득 반짝임 파티클

    // === 로컬 스토리지 최고 점수 관리 ===
    function loadHighScore() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            highScore = saved ? parseInt(saved, 10) || 0 : 0;
        } catch (e) {
            highScore = 0;
        }
        highScoreEl.textContent = highScore;
    }

    function saveHighScore(newScore) {
        if (newScore > highScore) {
            highScore = newScore;
            highScoreEl.textContent = highScore;
            try {
                localStorage.setItem(STORAGE_KEY, String(highScore));
            } catch (e) {
                // 스토리지 제한 환경 무시
            }
        }
    }

    // === 특정 스테이지 데이터 초기화 ===
    function setupStage(stageNum, resetTotalScore = false) {
        currentStage = Math.max(1, Math.min(MAX_STAGE, stageNum));
        const config = STAGE_CONFIGS[currentStage - 1];

        starsCollected = 0;
        currentTickInterval = config.tickMs;
        obstacles = config.getObstacles();
        particles = [];

        if (resetTotalScore) {
            score = 0;
        }
        // 현재 단계 진입 시점의 점수를 기록해 단계 재도전 시 해당 단계 시작 점수로 복원
        stageStartScore = score;

        // 20x20 중앙 좌측에 길이 3의 뱀 초기 배치 (오른쪽 진행)
        snake = [
            { x: 6, y: 10 },
            { x: 5, y: 10 },
            { x: 4, y: 10 }
        ];
        currentDir = 'RIGHT';
        inputQueue = [];

        spawnStar();
        updateHudUI();
    }

    // === 빈 칸에 무작위 별(★) 생성 ===
    function spawnStar() {
        const emptyCells = [];
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const onSnake = snake.some(seg => seg.x === x && seg.y === y);
                const onObstacle = obstacles.some(obs => obs.x === x && obs.y === y);
                if (!onSnake && !onObstacle) {
                    emptyCells.push({ x, y });
                }
            }
        }
        if (emptyCells.length > 0) {
            const idx = Math.floor(Math.random() * emptyCells.length);
            starItem = emptyCells[idx];
        }
    }

    // === 별 획득 파티클 생성 ===
    function createStarParticles(gridX, gridY) {
        const cx = (gridX + 0.5) * cellSize;
        const cy = (gridY + 0.5) * cellSize;
        for (let i = 0; i < 10; i++) {
            const angle = (Math.PI * 2 * i) / 10;
            const speed = 1.2 + Math.random() * 1.8;
            particles.push({
                x: cx,
                y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0
            });
        }
    }

    // === 반응형 캔버스 크기 계산 ===
    function resizeCanvas() {
        const rect = boardWrapper.getBoundingClientRect();
        const availableSize = Math.floor(Math.min(rect.width, rect.height) - 12);
        const clampedSize = Math.max(220, availableSize);

        cellSize = Math.floor(clampedSize / GRID_SIZE);
        const exactBoardPixels = cellSize * GRID_SIZE;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = exactBoardPixels * dpr;
        canvas.height = exactBoardPixels * dpr;
        canvas.style.width = `${exactBoardPixels}px`;
        canvas.style.height = `${exactBoardPixels}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render(performance.now());
    }

    // === 방향 입력 큐 처리 (역방향 및 연타 버그 원천 차단) ===
    function queueDirection(newDir) {
        if (!DIRECTIONS[newDir]) return;

        // READY 상태일 때 방향키/패드를 누르면 즉시 게임 시작
        if (gameState === 'READY') {
            startGame();
        }
        if (gameState !== 'PLAYING') return;

        const lastPlannedDir = inputQueue.length > 0
            ? inputQueue[inputQueue.length - 1]
            : currentDir;

        if (newDir === lastPlannedDir || DIRECTIONS[newDir].opposite === lastPlannedDir) {
            return;
        }

        if (inputQueue.length < 2) {
            inputQueue.push(newDir);
        }
    }

    // === 게임 틱(1칸 전진) 업데이트 ===
    function stepGame() {
        if (inputQueue.length > 0) {
            currentDir = inputQueue.shift();
        }

        const dirVec = DIRECTIONS[currentDir];
        const head = snake[0];
        const nextHead = {
            x: head.x + dirVec.x,
            y: head.y + dirVec.y
        };

        // 1. 외벽 충돌 검사
        if (
            nextHead.x < 0 ||
            nextHead.x >= GRID_SIZE ||
            nextHead.y < 0 ||
            nextHead.y >= GRID_SIZE
        ) {
            handleGameOver();
            return;
        }

        // 2. 스테이지 장애물 충돌 검사
        const hitObstacle = obstacles.some(obs => obs.x === nextHead.x && obs.y === nextHead.y);
        if (hitObstacle) {
            handleGameOver();
            return;
        }

        // 3. 자기 몸통 충돌 검사 (별을 먹지 않으면 꼬리는 빠지므로 tail 제외 검사)
        const willEatStar = (nextHead.x === starItem.x && nextHead.y === starItem.y);
        const bodyToCheck = willEatStar ? snake : snake.slice(0, snake.length - 1);
        const hitSelf = bodyToCheck.some(seg => seg.x === nextHead.x && seg.y === nextHead.y);
        if (hitSelf) {
            handleGameOver();
            return;
        }

        // 머리 전진
        snake.unshift(nextHead);

        // 4. 별(★) 획득 판정
        if (willEatStar) {
            starsCollected += 1;
            score += POINTS_PER_STAR;
            createStarParticles(nextHead.x, nextHead.y);
            updateHudUI();

            // 해당 스테이지 별 10개 달성 여부 확인
            if (starsCollected >= STARS_PER_STAGE) {
                handleStageClear();
                return;
            }
            spawnStar();
        } else {
            snake.pop();
        }
    }

    // === 게임 상태 전환 제어 ===
    function startGame() {
        if (gameState === 'PLAYING') return;

        if (gameState === 'GAMEOVER') {
            // 탈락한 현재 단계 유지 & 해당 단계 시작 점수로 복원하여 바로 재도전
            score = stageStartScore;
            setupStage(currentStage, false);
        } else if (gameState === 'ALL_CLEAR') {
            setupStage(1, true);
        } else if (gameState === 'STAGE_CLEAR') {
            setupStage(currentStage + 1, false);
        } else if (gameState === 'READY') {
            setupStage(currentStage, currentStage === 1);
        }

        gameState = 'PLAYING';
        hideOverlay();
        updateControlButtons();
        lastTickTime = performance.now();
    }

    function togglePause() {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            showOverlay('PAUSED', `STAGE ${currentStage} 일시정지 중입니다.`, '계속하기', 'default');
            updateControlButtons();
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            hideOverlay();
            updateControlButtons();
            lastTickTime = performance.now();
        }
    }

    function restartFromStageOne() {
        setupStage(1, true);
        gameState = 'PLAYING';
        hideOverlay();
        updateControlButtons();
        lastTickTime = performance.now();
        render(performance.now());
    }

    function handleStageClear() {
        score += STAGE_CLEAR_BONUS;
        updateHudUI();

        if (currentStage >= MAX_STAGE) {
            // 10단계 최종 클리어!
            gameState = 'ALL_CLEAR';
            updateControlButtons();
            showOverlay(
                'ALL CLEAR! 🎉',
                `축하합니다! 10단계를 모두 정복했습니다!<br>클리어 보너스 +${STAGE_CLEAR_BONUS}점 포함<br>최종 점수: <strong>${score}점</strong>`,
                '처음부터 다시 플레이',
                'stageclear'
            );
        } else {
            // 다음 스테이지 대기 화면
            gameState = 'STAGE_CLEAR';
            const nextConfig = STAGE_CONFIGS[currentStage];
            updateControlButtons();
            showOverlay(
                `STAGE ${currentStage} CLEAR!`,
                `클리어 보너스 <strong>+${STAGE_CLEAR_BONUS}점</strong> 획득!<br>다음: <strong>${nextConfig.name}</strong><br><span style="font-size:0.8rem">${nextConfig.desc}</span>`,
                `STAGE ${currentStage + 1} 시작`,
                'stageclear'
            );
        }
    }

    function handleGameOver() {
        gameState = 'GAMEOVER';
        saveHighScore(score);
        updateControlButtons();

        showOverlay(
            'GAME OVER',
            `STAGE ${currentStage}에서 충돌했습니다.<br>획득한 별: <strong>★ ${starsCollected} / ${STARS_PER_STAGE}</strong><br>현재 점수: <strong>${score}점</strong>`,
            `STAGE ${currentStage} 다시 도전`,
            'gameover',
            currentStage > 1
        );
    }

    // === UI 업데이트 헬퍼 ===
    function updateHudUI() {
        stageValEl.textContent = `${currentStage} / ${MAX_STAGE}`;
        starValEl.textContent = `★ ${starsCollected} / ${STARS_PER_STAGE}`;
        starProgressFillEl.style.width = `${(starsCollected / STARS_PER_STAGE) * 100}%`;

    function updateControlButtons() {
        if (gameState === 'READY') {
            btnStart.disabled = false;

            btnPause.disabled = true;
            btnPause.textContent = '⏸ 일시정지';

        } else if (gameState === 'PLAYING') {
            btnStart.disabled = true;
            btnPause.disabled = false;
            btnPause.textContent = '⏸ 일시정지';
            btnPause.classList.remove('warning');
        } else if (gameState === 'PAUSED') {
            btnStart.disabled = true;
            btnPause.disabled = false;
            btnPause.textContent = '▶ 계속하기';
            btnPause.classList.add('warning');
        } else if (gameState === 'STAGE_CLEAR') {
            btnStart.disabled = false;
            btnStart.textContent = `▶ ${currentStage + 1}단계 시작`;
            btnPause.disabled = true;
            btnPause.textContent = '⏸ 일시정지';
            btnPause.classList.remove('warning');
        } else if (gameState === 'GAMEOVER') {
            btnStart.disabled = false;
            btnStart.textContent = `▶ ${currentStage}단계 재도전`;
            btnPause.disabled = true;
            btnPause.textContent = '⏸ 일시정지';
            btnPause.classList.remove('warning');
        } else {
            // ALL_CLEAR
            btnStart.disabled = false;
            btnStart.textContent = '▶ 게임 시작';

    function showOverlay(title, descHtml, btnText, styleType = 'default', showResetOption = false) {
        overlayTitle.textContent = title;
        overlayTitle.classList.remove('gameover', 'stageclear');
        if (styleType === 'gameover') overlayTitle.classList.add('gameover');
        if (styleType === 'stageclear') overlayTitle.classList.add('stageclear');

        overlayActionBtn.textContent = btnText;

        if (showResetOption) {
            overlayResetBtn.classList.remove('hidden');
        } else {
            overlayResetBtn.classList.add('hidden');
        }

        boardOverlay.classList.remove('hidden');

    function hideOverlay() {
        boardOverlay.classList.add('hidden');
        overlayResetBtn.classList.add('hidden');

    // === 캔버스 렌더링 (격자 + 장애물 + 황금 별 + 분홍색 뱀 + 파티클) ===
    function render(timestamp) {
        const boardPx = cellSize * GRID_SIZE;

        // 1. 어두운 아케이드 보드 배경 (딥 플럼 다크)
        ctx.fillStyle = '#140d1c';
        ctx.fillRect(0, 0, boardPx, boardPx);

        // 2. 20x20 격자선
        ctx.strokeStyle = '#241733';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 1; i < GRID_SIZE; i++) {
            const pos = i * cellSize;
            ctx.moveTo(pos, 0);
            ctx.lineTo(pos, boardPx);
            ctx.moveTo(0, pos);
            ctx.lineTo(boardPx, pos);
        }
        ctx.stroke();

        // 3. 스테이지 장애물 블록 렌더링
        drawObstacles();

        // 4. 황금 별(★) 먹이 렌더링
        drawStarItem(timestamp);

        // 5. 분홍색 아케이드 뱀 렌더링
        drawSnake();

        // 6. 별 획득 파티클 렌더링
        drawParticles();
    }

    function drawObstacles() {
        const pad = Math.max(1.5, cellSize * 0.08);
        const size = cellSize - pad * 2;
        const radius = Math.max(3, cellSize * 0.16);

        obstacles.forEach(obs => {
            const x = obs.x * cellSize + pad;
            const y = obs.y * cellSize + pad;

            // 장애물 본체 (어두운 크림슨 금속 블록)
            ctx.fillStyle = '#3b1623';
            drawRoundedRect(ctx, x, y, size, size, radius);
            ctx.fill();

            // 네온 레드 테두리
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.5;
            drawRoundedRect(ctx, x, y, size, size, radius);
            ctx.stroke();

            // 내부 X자 해칭 디테일
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.45)';
            ctx.lineWidth = 1.2;
            const inner = size * 0.25;
            ctx.beginPath();
            ctx.moveTo(x + inner, y + inner);
            ctx.lineTo(x + size - inner, y + size - inner);
            ctx.moveTo(x + size - inner, y + inner);
            ctx.lineTo(x + inner, y + size - inner);
            ctx.stroke();
        });
    }

    function drawStarItem(timestamp) {
        const pulse = 1 + Math.sin(timestamp / 160) * 0.12;
        const rotateAngle = (timestamp / 900) % (Math.PI * 2);
        const cx = (starItem.x + 0.5) * cellSize;
        const cy = (starItem.y + 0.5) * cellSize;
        const outerRadius = (cellSize * 0.4) * pulse;
        const innerRadius = outerRadius * 0.46;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotateAngle);

        ctx.shadowColor = 'rgba(251, 191, 36, 0.9)';
        ctx.shadowBlur = 12;

        // 5각 황금 별 그리기
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? outerRadius : innerRadius;
            const angle = (Math.PI / 5) * i - Math.PI / 2;
            const sx = Math.cos(angle) * r;
            const sy = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
        ctx.closePath();

        ctx.fillStyle = '#fbbf24';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#fef08a';
        ctx.stroke();

        ctx.restore();
    }

    function drawSnake() {
        const padding = Math.max(1.5, cellSize * 0.08);
        const segSize = cellSize - padding * 2;
        const cornerRadius = Math.max(4, cellSize * 0.24);

        for (let i = snake.length - 1; i >= 0; i--) {
            const seg = snake[i];
            const x = seg.x * cellSize + padding;
            const y = seg.y * cellSize + padding;
            const isHead = (i === 0);

            if (isHead) {
                ctx.fillStyle = '#f472b6';
                ctx.shadowColor = 'rgba(244, 114, 182, 0.55)';
                ctx.shadowBlur = 10;
            } else {
                const ratio = Math.max(0.55, 1 - (i / (snake.length + 6)) * 0.45);
                ctx.fillStyle = `rgba(236, 72, 153, ${ratio})`;
                ctx.shadowBlur = 0;
            }

            drawRoundedRect(ctx, x, y, segSize, segSize, cornerRadius);
            ctx.fill();

            ctx.lineWidth = 1;
            ctx.strokeStyle = isHead ? '#fbcfe8' : '#be185d';
            ctx.stroke();
            ctx.shadowBlur = 0;

            if (isHead) {
                drawSnakeEyes(seg.x * cellSize, seg.y * cellSize);
            }
        }
    }

    function drawSnakeEyes(cellX, cellY) {
        const eyeRadius = Math.max(1.8, cellSize * 0.1);
        let eye1 = { x: 0, y: 0 };
        let eye2 = { x: 0, y: 0 };

        if (currentDir === 'RIGHT') {
            eye1 = { x: cellX + cellSize * 0.72, y: cellY + cellSize * 0.3 };
            eye2 = { x: cellX + cellSize * 0.72, y: cellY + cellSize * 0.7 };
        } else if (currentDir === 'LEFT') {
            eye1 = { x: cellX + cellSize * 0.28, y: cellY + cellSize * 0.3 };
            eye2 = { x: cellX + cellSize * 0.28, y: cellY + cellSize * 0.7 };
        } else if (currentDir === 'UP') {
            eye1 = { x: cellX + cellSize * 0.3, y: cellY + cellSize * 0.28 };
            eye2 = { x: cellX + cellSize * 0.7, y: cellY + cellSize * 0.28 };
        } else {
            eye1 = { x: cellX + cellSize * 0.3, y: cellY + cellSize * 0.72 };
            eye2 = { x: cellX + cellSize * 0.7, y: cellY + cellSize * 0.72 };
        }

        ctx.fillStyle = '#500724';
        ctx.beginPath();
        ctx.arc(eye1.x, eye1.y, eyeRadius, 0, Math.PI * 2);
        ctx.arc(eye2.x, eye2.y, eyeRadius, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.fillStyle = `rgba(253, 224, 71, ${p.life})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2.5 * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawRoundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + width - radius, y);
        context.quadraticCurveTo(x + width, y, x + width, y + radius);
        context.lineTo(x + width, y + height - radius);
        context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        context.lineTo(x + radius, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
    }

    // === 메인 애니메이션 루프 ===
    function gameLoop(timestamp) {
        if (gameState === 'PLAYING') {
            if (timestamp - lastTickTime >= currentTickInterval) {
                stepGame();
                lastTickTime = timestamp;
            }
        }

        render(timestamp);
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // === 입력 이벤트 바인딩 ===
    document.addEventListener('keydown', (e) => {
        const keyMap = {
            ArrowUp: 'UP', KeyW: 'UP',
            ArrowDown: 'DOWN', KeyS: 'DOWN',
            ArrowLeft: 'LEFT', KeyA: 'LEFT',
            ArrowRight: 'RIGHT', KeyD: 'RIGHT'
        };

        if (keyMap[e.code]) {
            e.preventDefault();
            queueDirection(keyMap[e.code]);
            return;
        }

        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                togglePause();
            } else if (gameState === 'READY' || gameState === 'STAGE_CLEAR' || gameState === 'GAMEOVER' || gameState === 'ALL_CLEAR') {
                startGame();
            }
        } else if (e.code === 'Enter') {
            if (gameState !== 'PLAYING') {
                e.preventDefault();
                if (gameState === 'PAUSED') togglePause();
                else startGame();
            }
        }
    });

    // 모바일/태블릿 터치 D-Pad 버튼 바인딩
    dpadButtons.forEach((btn) => {
        const dir = btn.getAttribute('data-dir');

        const handlePress = (e) => {
            e.preventDefault();
            btn.classList.add('pressed');
            queueDirection(dir);
        };

        const handleRelease = (e) => {
            e.preventDefault();
            btn.classList.remove('pressed');
        };

        btn.addEventListener('pointerdown', handlePress);
        btn.addEventListener('pointerup', handleRelease);
        btn.addEventListener('pointerleave', handleRelease);
        btn.addEventListener('pointercancel', handleRelease);
    });

    // 상단 제어 버튼 및 오버레이 버튼 바인딩
    btnStart.addEventListener('click', startGame);
    btnPause.addEventListener('click', togglePause);
    btnRestart.addEventListener('click', restartFromStageOne);

    overlayActionBtn.addEventListener('click', () => {
        if (gameState === 'PAUSED') {
            togglePause();
        } else {
            startGame();
        }
    });

    overlayResetBtn.addEventListener('click', restartFromStageOne);

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 100);
    });

    // === 앱 시작 ===
    window.onload = function () {
        loadHighScore();
        setupStage(1, true);
        updateControlButtons();
        resizeCanvas();
        animationFrameId = requestAnimationFrame(gameLoop);
    };
})();
</script>
</body>
</html>
